name = "devforge"
main = "worker.js"
compatibility_date = "2026-11-17"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "devforge-db"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "devforge-files"

[vars]
JWT_SECRET = "devforge-replace-this-with-a-long-random-string-CHANGE-ME"
